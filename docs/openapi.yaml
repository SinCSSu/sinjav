openapi: 3.1.0
info:
  title: sinJav API
  description: |
    sinJav 后端 API：JAV 影片目录扫描、番号识别、JavBus/JavDB 元数据刮削、文件整理（硬链接/软链接/移动/复制）与媒体中心兼容输出（nfo + 封面/剧照）。

    设计原则（参考 JavBoss）：
    - 零侵入：除移动模式外不修改源目录文件，整理结果与数据独立存放
    - 元数据绑定文件指纹（路径 + 大小 + mtime）而非文件名
    - 全部操作由 API 触发，无定时任务
  version: 0.1.0
servers:
  - url: http://localhost:8656
    description: 本地开发

tags:
  - name: scan
    description: 目录扫描与番号识别
  - name: fs
    description: 本地文件系统浏览与视频流（只读）
  - name: scrape
    description: 元数据刮削（JavBus / JavDB）
  - name: organize
    description: 文件整理（硬链接/软链接/移动/复制）与 nfo、图片输出
  - name: movies
    description: 影片元数据查询
  - name: file-records
    description: 文件记录查询
  - name: jobs
    description: 异步任务状态查询
  - name: settings
    description: 运行时配置
  - name: emby
    description: Emby 集成（媒体库浏览、元数据编辑、重新刮削）

paths:
  /api/v1/fs/roots:
    get:
      tags: [fs]
      operationId: listFsRoots
      summary: 目录树根节点
      description: Windows 返回各盘符（C:\、D:\…），Linux/Docker 返回 /。
      responses:
        '200':
          description: 根节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FsNode'

  /api/v1/fs/dirs:
    get:
      tags: [fs]
      operationId: listFsDirs
      summary: 列出子目录（目录树懒加载）
      parameters:
        - name: path
          in: query
          required: true
          description: 目录绝对路径
          schema:
            type: string
      responses:
        '200':
          description: 子目录列表（按名称排序，不含文件）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsDirListing'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scans/preview:
    post:
      tags: [scan]
      operationId: previewScan
      summary: 预览扫描（同步，不写数据库）
      description: |
        同步遍历目录返回候选文件列表与番号识别结果，供前端勾选排除后再正式扫描。
        超过 5000 条截断（truncated=true）。支持文件名正则预过滤（与正式扫描同规则）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanPreviewRequest'
      responses:
        '200':
          description: 候选文件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/scans/commit:
    post:
      tags: [scan]
      operationId: commitScan
      summary: 扫描结果落库
      description: |
        将预览扫描中用户保留的文件直接写入 file_records 并创建 pending 影片记录。
        按路径+大小+mtime 指纹 upsert，重复提交幂等。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCommitRequest'
      responses:
        '200':
          description: 落库结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCommitResult'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/videos:
    get:
      tags: [fs]
      operationId: streamVideo
      summary: 视频流预览（HTTP Range 分片传输）
      description: |
        按分片返回本地视频文件，浏览器 <video> 可边下边播、拖动进度。
        MP4/WebM/MOV（H.264）可播放；MKV/AVI 等浏览器原生不支持。零侵入只读。
      parameters:
        - name: path
          in: query
          required: true
          description: 视频文件绝对路径
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: 标准 HTTP Range 头（如 bytes=0-99）
          schema:
            type: string
      responses:
        '200':
          description: 完整文件
          content:
            video/*:
              schema:
                type: string
                format: binary
        '206':
          description: 分片内容
          content:
            video/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scans:
    post:
      tags: [scan]
      operationId: triggerScan
      summary: 触发目录扫描
      description: |
        递归扫描指定源目录（零侵入，只读取），识别视频文件中的 JAV 番号并写入 file_records。
        已存在（路径相同且大小/mtime 未变化）的文件会被跳过，支持增量扫描。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '202':
          description: 任务已创建，异步执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 已有同类任务在运行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/scrape:
    post:
      tags: [scrape]
      operationId: triggerScrape
      summary: 触发元数据刮削
      description: |
        从 JavBus / JavDB 刮削元数据并入库。可指定番号列表；不指定时处理所有「有文件记录但未刮削」的番号。
        刮削失败的番号记录失败原因，可通过再次调用本接口重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
      responses:
        '202':
          description: 任务已创建，异步执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 已有同类任务在运行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/scrape/preview:
    post:
      tags: [scrape]
      operationId: scrapePreview
      summary: 多源对比刮削预览（单番号，同步）
      description: |
        并发抓取全部数据源（不落库），返回每个字段各来源的原文值与按合并规则的默认来源。
        供前端对比界面逐字段选择来源后再调用 /scrape/apply 落库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapePreviewRequest'
      responses:
        '200':
          description: 各源刮削结果对比
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapePreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/scrape/apply:
    post:
      tags: [scrape]
      operationId: scrapeApply
      summary: 多源对比刮削落库（单番号，同步）
      description: |
        按逐字段的来源选择（各来源 id / 留空 / manual 手动输入）与输入框当前内容组装元数据，
        不自动翻译（标题/简介/类别的翻译或繁→简转换由前端调用 /scrape/translate 预先回填），
        写库并把影片置为 scraped，同步下载封面/剧照。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeApplyRequest'
      responses:
        '200':
          description: 落库完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string }
                  status: { type: string, enum: [scraped] }
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/scrape/translate:
    post:
      tags: [scrape]
      operationId: scrapeTranslate
      summary: 对比界面手动翻译（同步，不落库）
      description: |
        对标题/简介做翻译或繁→简转换（已是中文则仅繁→简；翻译失败回退原文），
        类别逐个翻译后以「 / 」重新拼接。仅处理请求中携带的非空白字段，其余返回 null。
        返回的译文由前端回填输入框，之后调用 /scrape/apply 按输入框内容落库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeTranslateRequest'
      responses:
        '200':
          description: 翻译完成，字段与请求一一对应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeTranslateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/scrape/manual:
    post:
      tags: [scrape]
      operationId: scrapeManual
      summary: 手动落库（单番号，同步）：手动录入元数据并上传封面/剧照
      description: |
        不抓取、不翻译：用户手动输入元数据（番号必填），上传的封面/剧照字节直接写入本地图片目录
        （poster.jpg / previewN.jpg，上传文件优先于 URL 下载结果）。标题落库为「番号-标题」，
        影片置为 scraped（source=manual），之后可正常整理。目标记录不存在时自动建 pending。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string, description: 番号（后端自动规范化） }
                title: { type: string, nullable: true, description: 标题（视为中文标题，落库为「番号-标题」） }
                titleOrig: { type: string, nullable: true, description: 原标题（NFO originaltitle 用） }
                plot: { type: string, nullable: true, description: 简介 }
                releaseDate: { type: string, nullable: true, description: 发行日期 yyyy-MM-dd（无法解析时忽略） }
                durationMin: { type: integer, nullable: true, description: 时长（分钟） }
                director: { type: string, nullable: true }
                maker: { type: string, nullable: true, description: 厂商 }
                label: { type: string, nullable: true, description: 发行商 }
                series: { type: string, nullable: true, description: 系列 }
                actresses: { type: string, description: 女优，逗号/顿号/斜杠/换行分隔 }
                genres: { type: string, description: 类别，逗号/顿号/斜杠/换行分隔 }
                coverUrl: { type: string, nullable: true, description: 封面 URL（可选，与上传并存时上传优先） }
                previewUrls: { type: string, nullable: true, description: 剧照 URL 列表（可选，逗号/换行分隔） }
                cover: { type: string, format: binary, description: 上传封面文件（可选，保存为 poster.jpg） }
                previews:
                  type: array
                  description: 上传剧照文件（可选，按顺序保存为 previewN.jpg）
                  items: { type: string, format: binary }
      responses:
        '200':
          description: 落库完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string, description: 规范化后的番号 }
                  status: { type: string, enum: [scraped] }
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organize:
    post:
      tags: [organize]
      operationId: triggerOrganize
      summary: 触发文件整理
      description: |
        将已刮削的文件按命名模板整理到目标目录，并生成 .nfo、poster.jpg、fanart.jpg、剧照。
        mode 决定整理方式：
        - `hardlink`：硬链接（需同一分区，Windows 需管理员或开发者模式）
        - `symlink`：符号链接（Windows 需管理员或开发者模式）
        - `move`：移动（唯一会修改源目录的模式）
        - `copy`：复制
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizeRequest'
      responses:
        '202':
          description: 任务已创建，异步执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 已有同类任务在运行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organize/preview:
    post:
      tags: [organize]
      operationId: previewOrganize
      summary: 整理预览（同步）
      description: |
        按给定参数（省略时使用全局配置）为每条文件记录计算完整目标路径，
        不执行、不写库。已整理记录返回 reorganize=true 及原整理结果信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizePreviewRequest'
      responses:
        '200':
          description: 预览结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizePreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/organize/records:
    get:
      tags: [organize]
      operationId: listOrganizeRecords
      summary: 整理弹窗文件记录列表
      description: |
        按分组返回文件记录，联出影片标题与封面。
        exists 分组为「已存在」：番号已存在于 Emby（最近一次 POST /emby/sync 快照）且本地尚未整理；
        pending 分组会排除这些番号，保证分组互斥。
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [pending, organizing, organized, exists]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 100
        - name: keyword
          in: query
          schema:
            type: string
          description: 模糊匹配番号/文件名/影片标题
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizeRecordDto'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pipeline:
    post:
      tags: [scan]
      operationId: triggerPipeline
      summary: 触发组合任务（扫描 → 刮削 → 整理）
      description: |
        一次性执行完整流水线：按 scan 参数扫描识别 → 按刮削配置刮削 → 按 organize 参数整理。
        各段配置可省略（scan.sourceDirs 必填），省略的段使用全局配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scan:
                  $ref: '#/components/schemas/ScanRequest'
                scrape:
                  $ref: '#/components/schemas/ScrapeRequest'
                organize:
                  $ref: '#/components/schemas/OrganizeRequest'
      responses:
        '202':
          description: 任务已创建，异步执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 已有同类任务在运行
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/movies:
    get:
      tags: [movies]
      operationId: listMovies
      summary: 分页查询影片元数据
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 按番号或标题模糊匹配
          schema:
            type: string
        - name: status
          in: query
          description: 刮削状态过滤
          schema:
            $ref: '#/components/schemas/MovieStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [release_date, number, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 影片分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'

  /api/v1/movies/{number}:
    get:
      tags: [movies]
      operationId: getMovie
      summary: 查询单部影片详情（含文件记录）
      parameters:
        - $ref: '#/components/parameters/NumberPath'
      responses:
        '200':
          description: 影片详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [movies]
      operationId: deleteMovie
      summary: 删除影片记录
      description: |
        删除影片记录及其关联（女优/类型关联）、该番号的全部文件记录、本地刮削图片缓存目录。
        不删除任何视频文件（含已整理的输出）。
      parameters:
        - $ref: '#/components/parameters/NumberPath'
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/file-records:
    get:
      tags: [file-records]
      operationId: listFileRecords
      summary: 分页查询文件记录
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: number
          in: query
          description: 按番号过滤
          schema:
            type: string
        - name: recognizeStatus
          in: query
          schema:
            $ref: '#/components/schemas/RecognizeStatus'
        - name: organizeStatus
          in: query
          schema:
            $ref: '#/components/schemas/OrganizeStatus'
      responses:
        '200':
          description: 文件记录分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecordPage'

  /api/v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: 查询任务列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/JobType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'

  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 查询任务状态、进度与失败明细
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/jobs/{jobId}/stop:
    post:
      tags: [jobs]
      operationId: stopJob
      summary: 停止运行中的任务
      description: 协作式取消——执行侧在处理间隙检查停止标记，命中后把任务落库为 cancelled；当前正在执行的条目会执行完，不会中途强杀。
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 停止请求已登记（返回当前任务状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: 任务不在运行中
          $ref: '#/components/responses/ValidationError'

  /api/v1/images:
    get:
      tags: [movies]
      operationId: proxyImage
      summary: 图片代理
      description: |
        转发源站（JavBus/JavDB 及其图床）图片。源站图片有 Referer 防盗链，浏览器无法直接加载，
        由后端携带正确 Referer 拉取后返回。仅允许白名单域名，防止 SSRF。
      parameters:
        - name: url
          in: query
          required: true
          description: 源站图片绝对地址
          schema:
            type: string
      responses:
        '200':
          description: 图片内容
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: URL 非法或域名不在白名单
        '502':
          description: 源站拉取失败

  # ---------- 认证 ----------
  # 除 /api/v1/auth/** 与 /local-images/** 外，所有 /api/v1/** 均需登录会话（SINJAV_SESSION Cookie，
  # 30 天 TTL、每次登录续期）；未登录返回 401 ProblemDetail {"title":"Unauthorized","detail":"未登录或会话已过期"}。

  /api/v1/auth/status:
    get:
      tags: [auth]
      operationId: authStatus
      summary: 认证状态（是否已初始化 / 是否已登录）
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /api/v1/auth/init:
    post:
      tags: [auth]
      operationId: authInit
      summary: 首次初始化管理员账号（仅库中无凭据时可用，先到先得）
      description: 成功后自动登录（建立会话）。重复初始化返回 409；密码少于 6 位返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInitRequest'
      responses:
        '200':
          description: 初始化完成并已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '409':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: 登录（建立 30 天会话，每次登录续期）
      description: 连续失败 5 次触发全局锁定 15 分钟（429）；用户名或密码错误返回 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: 用户名或密码错误
        '429':
          description: 失败次数过多，账号临时锁定

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: 退出登录（销毁会话）
      responses:
        '204':
          description: 已退出

  /api/v1/auth/credentials:
    put:
      tags: [auth]
      operationId: authUpdateCredentials
      summary: 修改用户名/密码（需登录并验证当前密码）
      description: 用户名与新密码至少填一项，可只改其一；当前密码错误返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 查询运行时配置
      responses:
        '200':
          description: 当前生效配置（application.yaml 默认值 + 数据库覆盖值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 更新运行时配置（持久化到数据库，立即生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新后的完整配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/settings/images/cleanup:
    post:
      tags: [settings]
      operationId: cleanupImageCache
      summary: 手动清理过期图片缓存
      description: 按设置页配置的 TTL（imagesTtlDays，0 = 永久保留）删除 data/images 下的过期文件并移除空目录；定时任务每日 04:00 也会自动执行。重新刮削会重写图片文件（mtime 更新，自动续期）。
      responses:
        '200':
          description: 清理结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: integer, description: 删除的文件数 }
                  bytes: { type: integer, description: 释放的字节数 }

  /api/v1/emby/status:
    get:
      tags: [emby]
      operationId: getEmbyStatus
      summary: 测试 Emby 连接（返回服务器名称与版本）
      responses:
        '200':
          description: 服务器信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverName: { type: string }
                  version: { type: string }

  /api/v1/emby/libraries:
    get:
      tags: [emby]
      operationId: listEmbyLibraries
      summary: Emby 媒体库列表
      responses:
        '200':
          description: 媒体库列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmbyLibrary'

  /api/v1/emby/sync:
    post:
      tags: [emby]
      operationId: syncEmbyLibrary
      summary: 同步 Emby 媒体库番号快照（同步执行）
      description: |
        遍历全部电影媒体库，从条目文件路径/原标题/标题识别番号，全量替换本地 emby_items 快照表。
        查询侧据此为本地影片返回 embyExists 标记，并把「emby 已存在但本地未整理」的文件
        归入 GET /organize/records 的 exists 分组。
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbySyncResult'
        '400':
          description: 未配置 Emby 服务地址或 API Key

  /api/v1/emby/items:
    get:
      tags: [emby]
      operationId: listEmbyItems
      summary: 分页列出指定媒体库内的电影条目（实时代理，不落库）
      parameters:
        - { name: libraryId, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 24 } }
        - { name: keyword, in: query, description: 标题搜索, schema: { type: string } }
      responses:
        '200':
          description: 条目分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyPage'

  /api/v1/emby/items/{id}:
    get:
      tags: [emby]
      operationId: getEmbyItem
      summary: 条目完整元数据
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 条目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyItem'

  /api/v1/emby/items/{id}/metadata:
    put:
      tags: [emby]
      operationId: updateEmbyMetadata
      summary: 修改条目元数据（读取→覆盖→回写 Emby），返回更新后的完整条目
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyMetadataUpdate'
      responses:
        '200':
          description: 更新后的条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyItem'

  /api/v1/emby/items/{id}/rescrape/preview:
    post:
      tags: [emby]
      operationId: previewEmbyRescrape
      summary: 重新刮削预览（本地管线）：识别番号 → 并发抓全源 → 返回各源原始值与前后对比（不推送，同步执行）
      description: |
        从条目文件名/原标题/标题提取番号（识别链依次尝试；请求体 number 非空时用手动番号替代识别），
        调用本项目刮削管线并发抓取全部数据源，返回「当前 Emby 元数据 + 各源原始字段值(fields/defaults) +
        合并后的待应用元数据(proposed)」供前端逐字段选择来源；确认后调 /emby/items/{id}/rescrape/apply 回写。
        同步执行，受刮削限速影响可能耗时数十秒。无法识别番号返回 400；所有数据源刮削失败返回 500。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: 手动指定番号（自动识别失败时由用户输入）
      responses:
        '200':
          description: 刮削前后对比
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyRescrapePreview'

  /api/v1/emby/items/{id}/rescrape/apply:
    post:
      tags: [emby]
      operationId: applyEmbyRescrape
      summary: 重新刮削应用（本地管线）：按逐字段来源选择与输入框当前内容组装元数据并回写 Emby（同步）
      description: |
        fields 与 /scrape/apply 同结构：来源 id 选择时 value 为输入框当前内容（不自动翻译，
        翻译由前端调用 /scrape/translate 预先回填）；留空（null/缺省）的字段不回写。
        标题统一为「番号-标题」、原文存原标题；简介→概述；
        厂商/厂牌→工作室；女优/系列/导演/厂牌→标签；类别过滤画质标签。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyRescrapeApplyRequest'
      responses:
        '200':
          description: 已应用的元数据（回写内容）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyMetadataUpdate'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/emby/items/{id}/images/primary:
    get:
      tags: [emby]
      operationId: getEmbyPrimaryImage
      summary: 封面代理（后端转发 Emby 主图，不暴露 API Key；无图返回 404）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: maxWidth, in: query, schema: { type: integer, default: 300 } }
      responses:
        '200':
          description: 图片二进制
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404':
          description: 条目无主图

  /api/v1/emby/items/{id}/images/primary:
    post:
      tags: [emby]
      operationId: pushEmbyPrimaryImage
      summary: 推送封面到 Emby（Primary 图，重新刮削界面「推送封面」）
      description: |
        预览提供的封面 URL 优先下载（横版全封套扫描自动裁为竖版，FC2 番号不裁）；
        失败或未提供时回退本地图片缓存 data/images/{番号}/poster.jpg。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyImagePushRequest'
      responses:
        '200':
          description: 推送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyImagePushResult'
        '400':
          description: 无法获取封面（URL 下载失败且本地无缓存）

  /api/v1/emby/items/{id}/images/backdrops:
    post:
      tags: [emby]
      operationId: pushEmbyBackdropImages
      summary: 推送剧照到 Emby（Backdrop，重新刮削界面「推送剧照」）
      description: |
        先清空条目已有 Backdrop 再逐张上传，保证重复推送不叠加。
        剧照来源：预览提供的 previewUrls（下载失败的跳过）→ 回退本地图片缓存 preview1..N.jpg。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyImagePushRequest'
      responses:
        '200':
          description: 推送结果（pushed 为上传张数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyImagePushResult'
        '400':
          description: 无法获取剧照（URL 下载失败且本地无缓存）

components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    NumberPath:
      name: number
      in: path
      required: true
      description: 规范化番号，如 ABP-123、FC2-PPV-1234567
      schema:
        type: string

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: 请求参数校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- 请求 ----------
    ScanRequest:
      type: object
      description: 扫描请求
      properties:
        sourceDirs:
          type: array
          minItems: 1
          items:
            type: string
          description: 源目录绝对路径列表（零侵入，只读取）
        recursive:
          type: boolean
          default: true
          description: 是否递归子目录
        extensions:
          type: array
          items:
            type: string
          description: 视频扩展名白名单（省略时使用全局配置）
        minFileSizeMb:
          type: integer
          description: 最小文件大小（MB，省略时使用全局配置）
        excludePaths:
          type: array
          items:
            type: string
          description: 排除的文件绝对路径列表（预览后剔除的文件）
        filenamePattern:
          type: string
          description: 文件名正则，不匹配的文件直接过滤（省略时不过滤）
      required: [sourceDirs]

    ScanPreviewRequest:
      type: object
      description: 预览扫描请求
      properties:
        sourceDirs:
          type: array
          minItems: 1
          items:
            type: string
        recursive:
          type: boolean
          default: true
        extensions:
          type: array
          items:
            type: string
        minFileSizeMb:
          type: integer
          description: 最小文件大小（MB，预览时默认 0 不过滤）
        filenamePattern:
          type: string
          description: 文件名正则预过滤
      required: [sourceDirs]

    ScanPreviewResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScanPreviewItem'
        total:
          type: integer
          format: int64
          description: 过滤后总条数
        truncated:
          type: boolean
          description: 是否超过 5000 条被截断
      required: [items, total, truncated]

    ScanPreviewItem:
      type: object
      properties:
        sourcePath:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        fileMtime:
          type: string
          format: date-time
          nullable: true
        number:
          type: string
          nullable: true
          description: 识别出的番号（无法识别为 null）
        recognizeStatus:
          type: string
          enum: [recognized, unrecognized]
      required: [sourcePath, fileName, fileSize, recognizeStatus]

    ScanCommitRequest:
      type: object
      description: 扫描结果落库请求
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScanCommitItem'
      required: [items]

    ScanCommitItem:
      type: object
      properties:
        sourcePath:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        fileMtime:
          type: string
          format: date-time
          nullable: true
      required: [sourcePath, fileName, fileSize]

    ScanCommitResult:
      type: object
      properties:
        total:
          type: integer
          format: int64
        recognized:
          type: integer
          format: int64
        unrecognized:
          type: integer
          format: int64
      required: [total, recognized, unrecognized]

    FsNode:
      type: object
      properties:
        path:
          type: string
          description: 绝对路径（Windows 盘符或 Linux /）
        name:
          type: string
      required: [path, name]

    FsDirListing:
      type: object
      properties:
        path:
          type: string
        directories:
          type: array
          items:
            $ref: '#/components/schemas/FsNode'
      required: [path, directories]

    ScrapeRequest:
      type: object
      description: |
        刮削请求。数据源与合并策略由全局设置（设置页 sourceOrder/strategy）控制，不作为单次任务参数。
      properties:
        numbers:
          type: array
          items:
            type: string
          description: 指定番号列表；省略时刮削全部「未刮削」番号
      required: []

    ScrapePreviewRequest:
      type: object
      description: 多源对比刮削预览请求（单番号）
      properties:
        number:
          type: string
          description: 番号（自动规范化）
      required: [number]

    ScrapePreviewResponse:
      type: object
      description: 各数据源刮削结果对比
      properties:
        number:
          type: string
        sources:
          type: array
          items:
            type: string
          description: 有结果的来源 id（按 source-order 排序）
        fields:
          type: object
          description: 字段键 → 来源 id → 原文值（仅含该来源有值的字段）。字段键：title plot releaseDate durationMin director maker label series actresses genres coverUrl previewUrls
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        defaults:
          type: object
          description: 字段键 → 合并规则的默认来源 id（该字段所有来源均无值时为 null）
          additionalProperties:
            type: string
            nullable: true
      required: [number, sources, fields, defaults]

    ScrapeFieldChoice:
      type: object
      description: 单字段来源选择
      properties:
        source:
          type: string
          nullable: true
          description: 数据源 id；null=留空（清空该字段）；manual=手动输入
        value:
          type: string
          nullable: true
          description: 最终值：来源选择时为该来源原文，manual 时为用户输入。列表字段（actresses/genres/previewUrls）多值用逗号/换行分隔
      required: []

    ScrapeApplyRequest:
      type: object
      description: 多源对比刮削落库请求
      properties:
        number:
          type: string
          description: 落库番号（对比界面可编辑修正识别错误，后端自动规范化）
        recordNumber:
          type: string
          nullable: true
          description: 原记录番号；与 number 不同时把该记录改用 number 落库（movies/file_records 同步改番号），新番号已存在则 400
        fields:
          type: object
          description: 字段键 → 来源选择（缺省字段视为留空）
          additionalProperties:
            $ref: '#/components/schemas/ScrapeFieldChoice'
      required: [number]

    # ---------- 认证 ----------
    AuthStatus:
      type: object
      description: 认证状态
      properties:
        initialized:
          type: boolean
          description: 是否已初始化管理员账号
        username:
          type: string
          nullable: true
        authenticated:
          type: boolean
          description: 当前请求是否持有有效登录会话

    AuthInitRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128

    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthCredentialsRequest:
      type: object
      required: [currentPassword]
      description: 用户名与新密码至少填一项
      properties:
        currentPassword:
          type: string
        username:
          type: string
          nullable: true
          maxLength: 64
        newPassword:
          type: string
          nullable: true
          minLength: 6
          maxLength: 128

    LoginResult:
      type: object
      properties:
        username:
          type: string

    ScrapeTranslateRequest:
      type: object
      description: 对比界面手动翻译请求；仅传需要翻译的字段（省略/空白不处理）
      properties:
        title:
          type: string
          nullable: true
          description: 标题原文（做翻译或繁→简转换）
        plot:
          type: string
          nullable: true
          description: 简介原文（做翻译或繁→简转换）
        genres:
          type: string
          nullable: true
          description: 类别原文，逗号/顿号/斜杠/换行分隔；逐个翻译后以「 / 」重新拼接

    ScrapeTranslateResponse:
      type: object
      description: 手动翻译结果，字段与请求一一对应（翻译失败回退原文）
      properties:
        title:
          type: string
          nullable: true
        plot:
          type: string
          nullable: true
        genres:
          type: string
          nullable: true

    OrganizeRequest:
      type: object
      description: 整理请求
      properties:
        targetDir:
          type: string
          description: 目标目录绝对路径（必填，整理不再使用全局配置）
        mode:
          type: string
          enum: [hardlink, symlink, move, copy]
          description: 整理方式（必填，整理不再使用全局配置）
        namingTemplate:
          type: string
          description: 命名模板（省略时使用全局配置）。可用占位符：{number} {title} {date} {maker} {series} {actress}（多女优取第一个）
          example: '{number}/{number} - {title}'
        conflictPolicy:
          type: string
          enum: [skip, overwrite, rename]
          description: 目标已存在时的策略（省略时使用全局配置）
        generateNfo:
          type: boolean
          description: 是否生成 .nfo（省略时使用全局配置）
        downloadImages:
          type: boolean
          description: 是否下载 poster.jpg / fanart.jpg / 剧照（省略时使用全局配置）
        videoOnly:
          type: boolean
          description: 只整理视频：仅转移视频文件，不生成 nfo/图片（适配 Emby 已存在媒体的多分辨率入库）
        numbers:
          type: array
          items:
            type: string
          description: 仅整理指定番号；省略时整理所有「已刮削且待整理」的文件
        items:
          type: array
          description: |
            按文件记录逐条整理（优先于 numbers）。条目可覆盖目标路径与整理方式；
            记录已是 organized 状态时视为重整（先清理原整理结果）。
          items:
            $ref: '#/components/schemas/OrganizeItemRequest'
      required: [targetDir, mode]

    OrganizeItemRequest:
      type: object
      description: 逐条整理条目（以文件记录为单位）
      properties:
        recordId:
          type: integer
          format: int64
          description: 文件记录 id
        targetPath:
          type: string
          description: 完整目标路径（目录+文件名）；省略时按命名模板渲染。未带扩展名时自动补源文件扩展名
        mode:
          type: string
          enum: [hardlink, symlink, move, copy]
          description: 整理方式覆盖；省略时使用请求级 mode。原整理为移动的记录重整时不能使用链接模式
      required: [recordId]

    OrganizePreviewRequest:
      type: object
      description: 整理预览请求（同步计算目标路径，不执行）
      properties:
        recordIds:
          type: array
          items:
            type: integer
            format: int64
          description: 要预览的文件记录 id 列表
        targetDir:
          type: string
          description: 目标目录绝对路径（必填，整理不再使用全局配置）
        mode:
          type: string
          enum: [hardlink, symlink, move, copy]
          description: 整理方式（必填，整理不再使用全局配置）
        namingTemplate:
          type: string
          description: 命名模板（省略时使用全局配置）
        conflictPolicy:
          type: string
          enum: [skip, overwrite, rename]
          description: 冲突策略（省略时使用全局配置）
        videoOnly:
          type: boolean
          description: 只整理视频：仅计算视频目标路径，不生成 nfo/图片
      required: [recordIds, targetDir, mode]

    OrganizePreviewItem:
      type: object
      description: 单条文件记录的整理预览
      properties:
        recordId:
          type: integer
          format: int64
        sourcePath:
          type: string
        fileName:
          type: string
        number:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: 影片标题（无元数据时为 null）
        coverUrl:
          type: string
          nullable: true
          description: 封面图地址（无元数据时为 null）
        targetPath:
          type: string
          nullable: true
          description: 计算出的完整目标路径；计算失败时为 null（看 error）
        mode:
          type: string
          nullable: true
        conflictPolicy:
          type: string
          nullable: true
        reorganize:
          type: boolean
          description: 该记录已整理，执行时将先清理原结果再整理
        currentTargetPath:
          type: string
          nullable: true
          description: 已整理记录的当前目标路径
        currentLinkMode:
          type: string
          nullable: true
          description: 已整理记录的原整理方式（move 时重整不能用链接模式）
        error:
          type: string
          nullable: true
          description: 预览失败原因（无元数据/未刮削/路径计算失败等）
      required: [recordId, sourcePath, fileName, reorganize]

    OrganizePreviewResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizePreviewItem'
      required: [items]

    OrganizeRecordDto:
      type: object
      description: 整理弹窗列表行（文件记录 + 影片标题/封面）
      properties:
        recordId:
          type: integer
          format: int64
        sourcePath:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        number:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        organizeStatus:
          $ref: '#/components/schemas/OrganizeStatus'
        targetPath:
          type: string
          nullable: true
        linkMode:
          type: string
          nullable: true
          enum: [hardlink, symlink, move, copy, null]
      required: [recordId, sourcePath, fileName, fileSize, organizeStatus]

    SettingsUpdate:
      type: object
      description: 配置更新（仅提交需要修改的键）
      properties:
        sourceOrder:
          type: string
          example: 'javbus, javdb'
        strategy:
          type: string
          enum: [fallback, merge]
        userAgent:
          type: string
        javdbCookie:
          type: string
          description: JavDB 登录 Cookie
        proxyHost:
          type: string
        proxyPort:
          type: integer
        requestIntervalMs:
          type: integer
          description: 刮削请求最小间隔（毫秒），限速防风控
        concurrency:
          type: integer
          description: 刮削全局并发数
        namingTemplate:
          type: string
        conflictPolicy:
          type: string
          enum: [skip, overwrite, rename]
        generateNfo:
          type: boolean
        downloadImages:
          type: boolean
        imagesTtlDays:
          type: integer
          description: 图片缓存过期天数（0 = 永久保留，默认 3）
        embyBaseUrl:
          type: string
          description: Emby 服务地址（如 http://127.0.0.1:8096）
        embyApiKey:
          type: string
          description: Emby API Key（控制台「API 密钥」生成）
      required: []

    # ---------- 任务 ----------
    JobAccepted:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
      required: [jobId, type, status]

    JobType:
      type: string
      enum: [scan, scrape, organize, pipeline]

    JobStatus:
      type: string
      enum: [running, completed, failed, cancelled]

    Job:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        params:
          type: object
          additionalProperties: true
          description: 任务请求参数
        totalItems:
          type: integer
        doneItems:
          type: integer
        failItems:
          type: integer
        errors:
          type: array
          description: 失败明细
          items:
            $ref: '#/components/schemas/JobError'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, type, status, totalItems, doneItems, failItems, startedAt]

    JobError:
      type: object
      properties:
        item:
          type: string
          description: 失败项（源路径或番号）
        reason:
          type: string
      required: [item, reason]

    JobPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Job'

    # ---------- 影片 ----------
    MovieStatus:
      type: string
      enum: [pending, scraped, failed]

    MovieSummary:
      type: object
      properties:
        number:
          type: string
          example: ABP-123
        title:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        maker:
          type: string
          nullable: true
        actresses:
          type: array
          items:
            type: string
        coverUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MovieStatus'
        plot:
          type: string
          nullable: true
          description: 简介（中文简介在前，另起一段为原简介）
        embyExists:
          type: boolean
          description: 该番号已存在于 Emby 媒体库（依据最近一次 POST /emby/sync 快照）
      required: [number, status]

    Movie:
      type: object
      allOf:
        - $ref: '#/components/schemas/MovieSummary'
        - type: object
          properties:
            rawNumber:
              type: string
              nullable: true
            titleZh:
              type: string
              nullable: true
            titleOrig:
              type: string
              nullable: true
              description: 原始标题（标题已翻译为中文时保留）
            director:
              type: string
              nullable: true
            label:
              type: string
              nullable: true
            series:
              type: string
              nullable: true
            durationMin:
              type: integer
              nullable: true
            previewUrls:
              type: array
              items:
                type: string
            plot:
              type: string
              nullable: true
            source:
              type: string
              enum: [javbus, javdb, merged]
              nullable: true
            failReason:
              type: string
              nullable: true
            scrapedAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MovieDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/Movie'
        - type: object
          properties:
            fileRecords:
              type: array
              items:
                $ref: '#/components/schemas/FileRecord'

    MoviePage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MovieSummary'

    # ---------- 文件记录 ----------
    RecognizeStatus:
      type: string
      enum: [recognized, unrecognized, filtered]

    OrganizeStatus:
      type: string
      enum: [pending, organized, failed, skipped]

    EmbySyncResult:
      type: object
      description: Emby 媒体库同步结果（POST /emby/sync）
      properties:
        scanned:
          type: integer
          description: 扫描的 Emby 条目总数
        matched:
          type: integer
          description: 成功识别出番号的条目数
        syncedAt:
          type: string
          format: date-time
          description: 快照时间

    FileRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sourcePath:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        fileMtime:
          type: string
          format: date-time
        number:
          type: string
          nullable: true
        recognizeStatus:
          $ref: '#/components/schemas/RecognizeStatus'
        targetPath:
          type: string
          nullable: true
        linkMode:
          type: string
          enum: [hardlink, symlink, move, copy]
          nullable: true
        organizeStatus:
          $ref: '#/components/schemas/OrganizeStatus'
        organizeError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, sourcePath, fileName, fileSize, recognizeStatus, organizeStatus, createdAt]

    FileRecordPage:
      type: object
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FileRecord'

    # ---------- 配置 ----------
    Settings:
      type: object
      properties:
        sourceOrder:
          type: string
        strategy:
          type: string
          enum: [fallback, merge]
        userAgent:
          type: string
        javdbCookie:
          type: string
        proxyHost:
          type: string
        proxyPort:
          type: integer
        requestIntervalMs:
          type: integer
        concurrency:
          type: integer
        namingTemplate:
          type: string
        conflictPolicy:
          type: string
          enum: [skip, overwrite, rename]
        generateNfo:
          type: boolean
        downloadImages:
          type: boolean
        imagesTtlDays:
          type: integer
          description: 图片缓存过期天数（0 = 永久保留，默认 3）
        deeplApiKey:
          type: string
          description: DeepL API key（免费 key 以 :fx 结尾）；配置后翻译优先使用 DeepL
        autoTranslate:
          type: boolean
          description: 自动翻译开关（默认 true）。开启后批量刮削时翻译标题/简介/类别标签；关闭则直接落源站内容
        baiduTranslateAppId:
          type: string
          description: 百度翻译 APP ID（未配置 DeepL 时使用）
        baiduTranslateSecret:
          type: string
          description: 百度翻译密钥
        embyBaseUrl:
          type: string
          description: Emby 服务地址（如 http://127.0.0.1:8096）
        embyApiKey:
          type: string
          description: Emby API Key

    # ---------- Emby ----------
    EmbyLibrary:
      type: object
      properties:
        id: { type: string, description: 媒体库根节点 Id }
        name: { type: string }
        collectionType: { type: string, nullable: true }

    EmbyItemSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        originalTitle: { type: string, nullable: true }
        productionYear: { type: integer, nullable: true }
        premiereDate: { type: string, nullable: true }
        path: { type: string, nullable: true }
        hasImage: { type: boolean, description: 是否有主图（封面走代理接口） }

    EmbyImagePushRequest:
      type: object
      description: 图片推送请求（推送封面/推送剧照）
      properties:
        number:
          type: string
          description: 番号（用于本地图片缓存回退与 FC2 裁剪排除）
        coverUrl:
          type: string
          nullable: true
          description: 封面 URL（重新刮削预览的默认来源值）；省略时回退本地缓存
        previewUrls:
          type: array
          items: { type: string }
          nullable: true
          description: 剧照 URL 列表（重新刮削预览的默认来源值）；省略时回退本地缓存
      required: [number]

    EmbyImagePushResult:
      type: object
      description: 图片推送结果
      properties:
        pushed:
          type: integer
          description: 成功上传到 Emby 的图片数

    EmbyPage:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/EmbyItemSummary' }

    EmbyItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        originalTitle: { type: string, nullable: true }
        overview: { type: string, nullable: true }
        genres: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        premiereDate: { type: string, nullable: true }
        productionYear: { type: integer, nullable: true }
        officialRating: { type: string, nullable: true }
        communityRating: { type: number, nullable: true }
        runtimeMin: { type: integer, nullable: true }
        path: { type: string, nullable: true }
        providerIds: { type: object, additionalProperties: { type: string } }
        dateCreated: { type: string, nullable: true }
        hasImage: { type: boolean }

    EmbyMetadataUpdate:
      type: object
      description: 元数据修改（仅提交需要修改的字段）
      properties:
        name: { type: string }
        originalTitle: { type: string }
        overview: { type: string }
        genres: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        premiereDate: { type: string }
        productionYear: { type: integer }
        officialRating: { type: string }
        communityRating: { type: number }

    EmbyRescrapePreview:
      type: object
      description: 本地刮削预览：刮削前后元数据对比，确认后再应用
      properties:
        itemId: { type: string }
        matchedNumber: { type: string, description: 从条目文件名/原标题/标题识别出的番号（或手动输入） }
        source: { type: string, description: 刮削数据源 }
        current:
          $ref: '#/components/schemas/EmbyItem'
          description: 刮削前的当前 Emby 元数据
        proposed:
          $ref: '#/components/schemas/EmbyMetadataUpdate'
          description: 刮削得到的元数据（待确认应用）
        fields:
          type: object
          description: 多源对比：字段键 → 来源 id → 原文值（仅含该源有值的字段，与 /scrape/preview 同一套字段键）
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        defaults:
          type: object
          description: 多源对比：字段键 → 合并规则的默认来源 id（该字段所有来源均无值时为 null）
          additionalProperties:
            type: string
            nullable: true
        sources:
          type: array
          description: 多源对比：有结果的来源 id 列表（按 source-order 排序，供前端下拉选项）
          items:
            type: string

    EmbyRescrapeApplyRequest:
      type: object
      description: 多源对比重新刮削应用：按逐字段来源选择与输入框当前内容组装元数据并回写 Emby（留空字段不回写，不自动翻译）
      properties:
        number:
          type: string
          description: 预览时识别/手动输入的番号
        fields:
          type: object
          description: 字段键 → 来源选择（各来源 id / 留空 / manual），与 /scrape/apply 的 fields 同结构
          additionalProperties:
            $ref: '#/components/schemas/ScrapeFieldChoice'
      required: [number]

    # ---------- 通用 ----------
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
      required: [page, size, total, totalPages]

    Problem:
      type: object
      description: RFC 9457 Problem Detail 统一错误响应
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: 字段级校验错误（仅 400）
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

spring:
  application:
    name: sinJav
  datasource:
    # 默认 SQLite（零配置，data/sinjav.db）；外部部署时通过环境变量切换 PostgreSQL：
    # SINJAV_DB_URL=jdbc:postgresql://host:5432/sinjav SINJAV_DB_USER=sinjav SINJAV_DB_PASSWORD=***
    url: ${SINJAV_DB_URL:jdbc:sqlite:./data/sinjav.db}
    username: ${SINJAV_DB_USER:}
    password: ${SINJAV_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10   # SQLite 单写者，限制连接池；PostgreSQL 部署时建议调大
      data-source-properties:
        # 兼容 SQLite CURRENT_TIMESTAMP 的文本时间格式（PostgreSQL 驱动会忽略该属性）
        date_string_format: "yyyy-MM-dd HH:mm:ss"
  flyway:
    enabled: true
    # 按数据库方言自动选择迁移脚本目录：db/migration/postgresql 或 db/migration/sqlite
    locations: classpath:db/migration/{vendor}

server:
  port: 8656
  servlet:
    session:
      timeout: 30d          # 会话 30 天 TTL（访问自动续期）
      cookie:
        name: SINJAV_SESSION
        http-only: true
        same-site: lax
        max-age: 30d        # Cookie 不随浏览器关闭失效；每次登录重建会话即续期

sinjav:
  scraper:
    # 刮削源优先级：所有源并发请求，每个字段按此优先级从高到低取第一个非空值（列表字段取并集）
    source-order: javbus, javdb, missav
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    javdb-cookie: ""          # JavDB 登录 Cookie（部分信息需登录可见）
    proxy-host: ""            # 可选 HTTP 代理
    proxy-port: 0
    request-interval-ms: 1500 # 相邻请求最小间隔（限速）
    concurrency: 1            # 刮削全局并发
    timeout-ms: 15000
    cf-timeout-ms: 60000      # 过盾（cfProxy）请求超时：需等待 CF 挑战，通常比普通超时长
    max-retries-per-item: 1   # 单次任务内每条番号最大重试次数
    base-url-javbus: "https://www.javbus.com"
    base-url-javdb: "https://javdb.com"
    base-url-missav: "https://missav.ai"
    # CF 过盾代理（如 trawl MITM 正向代理）。运行时也可在设置页修改（settings 表持久化）
    cf-proxy-url: ""
    cf-proxy-sources: ""      # 需要 CF 过盾的数据源 id，逗号分隔，如 javdb
    # trawl CA 证书路径（PEM）。支持 classpath:ca.crt（打包进 jar）或文件系统路径（如挂载 trawl_ca 卷）；
    # 非空且可读时，过盾代理 client 信任该 CA（合并 JVM 默认 cacerts）。仅此处/环境变量可配
    cf-ca-cert-path: classpath:ca.crt
    deepl-api-key: ""          # DeepL API key（免费 key 以 :fx 结尾）；配置后优先使用
    baidu-translate-app-id: "" # 百度翻译 APP ID；未配置 DeepL 时使用
    baidu-translate-secret: "" # 百度翻译密钥
  organize:
    target-dir: ""
    mode: hardlink            # hardlink | symlink | move | copy
    naming-template: "{number}/{number}"
    conflict-policy: skip     # skip | overwrite | rename
    generate-nfo: true
    download-images: true
  scan:
    video-extensions: mp4, mkv, avi, wmv, iso, rmvb, ts, m2ts, mov, flv
    min-file-size-mb: 50      # 过滤小文件（样本/广告）
    filename-pattern: '(?i)(?:^|[^a-z0-9])(?:fc2[-_\s]?(?:ppv)?|[a-z]{2,6})[-_]?\d{2,9}(?!\d)|(?:^|[^0-9])\d{6}[-_]\d{2,3}(?!\d)'
  emby:
    base-url: ""              # Emby 服务地址（如 http://127.0.0.1:8096）；运行时也可在设置页修改
    api-key: ""               # Emby 控制台「API 密钥」生成的 key
    proxy-host: ""            # Emby 专用 HTTP 代理（留空直连）；与刮削代理互不影响
    proxy-port: 0
  async:
    job-pool-size: 2
    job-pool-queue-capacity: 100
  images:
    download: true             # 刮削成功后下载封面/剧照到本地
    dir: ./data/images         # 本地图片目录，Web 端通过 /local-images/{番号}/poster.jpg 访问

logging:
  level:
    top.sincs.sinjav: DEBUG
